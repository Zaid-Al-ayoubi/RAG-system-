<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مساعد سياسات الشركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-2: #e6ebe8;
    --ink: #16231f;
    --ink-muted: #56655f;
    --accent: #0f6656;
    --accent-dark: #0b4d41;
    --accent-soft: #dcede7;
    --gold: #9c7530;
    --gold-soft: #f3ecdc;
    --border: #d7ded9;
    --danger: #a8433c;
    --font: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
  }

  #app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .inner {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    background: var(--accent-dark);
    color: #fff;
    flex-shrink: 0;
    width: 100%;
  }
  header .inner { display: flex; align-items: center; gap: 12px; }

  .seal { width: 36px; height: 36px; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: rgba(255,255,255,0.72); font-weight: 400; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 0;
    background: radial-gradient(circle at 15% 0%, rgba(15,102,86,0.035), transparent 45%);
  }

  #messages .inner {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 22px;
  }

  .row { display: flex; max-width: 100%; }
  .row.user { justify-content: flex-start; }
  .row.assistant { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .row.user .bubble { background: var(--accent); color: #fff; border-bottom-left-radius: 4px; }
  .row.assistant .bubble { background: var(--surface-2); color: var(--ink); border-bottom-right-radius: 4px; }
  .row.assistant .bubble strong { color: var(--accent-dark); }

  .meta-row { display: flex; flex-direction: column; gap: 6px; max-width: 78%; margin-top: 6px; }
  .tool-chips, .source-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.tool { background: var(--accent-soft); color: var(--accent-dark); border: 1px solid rgba(15,102,86,0.18); }
  .chip.source { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(156,117,48,0.25); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted); opacity: 0.5; animation: bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.8; } }

  #input-row {
    display: flex;
    justify-content: center;
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    width: 100%;
  }
  #input-row .inner { display: flex; gap: 10px; }

  #user-input {
    flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-family: var(--font); font-size: 14.5px; background: var(--bg); color: var(--ink);
  }
  #user-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #send-btn {
    padding: 0 20px; background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font-family: var(--font); font-size: 14.5px; font-weight: 600; cursor: pointer; transition: background 0.15s ease;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-dark); }
  #send-btn:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }
  #send-btn:disabled { background: #a9c2bb; cursor: default; }

  #empty-state { text-align: center; color: var(--ink-muted); font-size: 13.5px; max-width: 320px; line-height: 1.7; margin: auto; padding-top: 20vh; }

  @media (max-width: 480px) {
    header, #input-row { padding-inline: 16px; }
    #messages .inner { padding-inline: 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="inner">
      <svg class="seal" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="18" stroke="#fff" stroke-opacity="0.85" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="12.5" stroke="#fff" stroke-opacity="0.5" stroke-width="1"/>
        <path d="M14 20.5L18 24.5L26.5 15.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>مساعد سياسات الشركة</h1>
        <p>إجازات · رواتب · تأمين · أمن سيبراني</p>
      </div>
    </div>
  </header>

  <div id="messages">
    <div class="inner" id="messages-inner">
      <div id="empty-state">اسأل عن أي سياسة داخلية، أو اطلب حساب مستحقات، أو افتح تذكرة دعم — المساعد بيختار الأداة المناسبة تلقائياً.</div>
    </div>
  </div>

  <div id="input-row">
    <div class="inner">
      <button id="send-btn">إرسال</button>
      <input id="user-input" type="text" placeholder="اسأل عن الإجازات، الرواتب، التأمين..." autocomplete="off" />
    </div>
  </div>
</div>

<script>
let sessionId = null;

const messagesEl = document.getElementById("messages-inner");
const messagesScroll = document.getElementById("messages");
const inputEl = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const emptyState = document.getElementById("empty-state");

const TOOL_LABELS = {
  rag_search: "🔍 بحث بالمستندات",
  calculator: "🧮 حساب",
  create_ticket: "🎫 تذكرة دعم",
};

function clearEmptyState() {
  if (emptyState) emptyState.remove();
}

function addUserMessage(text) {
  clearEmptyState();
  const row = document.createElement("div");
  row.className = "row user";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesScroll.scrollTop = messagesScroll.scrollHeight;
}

function addAssistantMessage(text, sources, toolTrace) {
  clearEmptyState();
  const row = document.createElement("div");
  row.className = "row assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatMarkdownLite(text);
  row.appendChild(bubble);
  messagesEl.appendChild(row);

  const meta = document.createElement("div");
  meta.className = "meta-row";
  meta.style.marginInlineStart = "auto";

  if (toolTrace && toolTrace.length) {
    const toolWrap = document.createElement("div");
    toolWrap.className = "tool-chips";
    toolWrap.style.justifyContent = "flex-end";
    const usedTools = [...new Set(toolTrace.map(t => t.tool))];
    usedTools.forEach(name => {
      const chip = document.createElement("span");
      chip.className = "chip tool";
      chip.textContent = TOOL_LABELS[name] || name;
      toolWrap.appendChild(chip);
    });
    meta.appendChild(toolWrap);
  }

  if (sources && sources.length) {
    const srcWrap = document.createElement("div");
    srcWrap.className = "source-chips";
    srcWrap.style.justifyContent = "flex-end";
    sources.forEach(s => {
      const chip = document.createElement("span");
      chip.className = "chip source";
      chip.textContent = `📄 ${s.source_document} — ${s.section}`;
      srcWrap.appendChild(chip);
    });
    meta.appendChild(srcWrap);
  }

  if (meta.children.length) messagesEl.appendChild(meta);
  messagesScroll.scrollTop = messagesScroll.scrollHeight;
}

function formatMarkdownLite(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "row assistant";
  row.id = "typing-row";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesScroll.scrollTop = messagesScroll.scrollHeight;
}

function hideTyping() {
  const row = document.getElementById("typing-row");
  if (row) row.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addUserMessage(text);
  inputEl.value = "";
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });

    if (!res.ok) {
      // السيرفر رجع خطأ HTTP (500 غالباً) - نحاول نقرأ التفاصيل لو موجودة
      const errText = await res.text();
      console.error("خطأ من السيرفر:", res.status, errText);
      hideTyping();
      addAssistantMessage(`صار خطأ بالسيرفر (${res.status}). افتح console المتصفح (F12) أو تيرمنال Flask لتفاصيل أكتر.`, [], []);
      return;
    }

    const data = await res.json();
    hideTyping();
    sessionId = data.session_id;
    addAssistantMessage(data.answer, data.sources, data.tool_trace);
  } catch (err) {
    console.error("خطأ بالاتصال:", err);
    hideTyping();
    addAssistantMessage("صار خطأ بالاتصال بالسيرفر، تأكد إنه Flask شغال وحاول مرة ثانية.", [], []);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
