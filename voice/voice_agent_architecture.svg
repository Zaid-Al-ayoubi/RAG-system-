<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Voice RAG Agent Architecture</title>
<desc>Pipeline: microphone input, Azure Speech-to-Text with automatic Arabic/English detection, the Agentic RAG agent with its tools and conversation memory, Azure Text-to-Speech output, and a barge-in loop through echo/noise filters that interrupts speech output and returns to listening.</desc>

<style>
  text { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .note { font-size: 12px; fill: #444441; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="720" fill="#FFFFFF"/>

<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2C2C2A">Voice RAG Agent — Architecture</text>

<!-- Node 1: Microphone -->
<rect x="170" y="50" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text class="th" x="330" y="70" text-anchor="middle">Microphone input</text>
<text class="ts" x="330" y="88" text-anchor="middle">Speaks Arabic or English</text>
<line x1="330" y1="106" x2="330" y2="166" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 2: STT -->
<rect x="170" y="166" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="330" y="186" text-anchor="middle" fill="#0C447C">Azure Speech-to-Text</text>
<text class="ts" x="330" y="204" text-anchor="middle" fill="#185FA5">Continuous, auto language ID</text>
<line x1="330" y1="222" x2="330" y2="282" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 3: Agent -->
<rect x="170" y="282" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
<text class="th" x="330" y="302" text-anchor="middle" fill="#3C3489">Agentic RAG agent</text>
<text class="ts" x="330" y="320" text-anchor="middle" fill="#534AB7">Tools + conversation memory</text>
<line x1="330" y1="338" x2="330" y2="398" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 4: TTS -->
<rect x="170" y="398" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
<text class="th" x="330" y="418" text-anchor="middle" fill="#085041">Azure Text-to-Speech</text>
<text class="ts" x="330" y="436" text-anchor="middle" fill="#0F6E56">Voice matches language</text>
<line x1="330" y1="454" x2="330" y2="514" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 5: Echo/noise filters (part of the barge-in loop) -->
<rect x="170" y="514" width="320" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
<text class="th" x="330" y="534" text-anchor="middle" fill="#712B13">Echo &amp; noise filters</text>
<text class="ts" x="330" y="552" text-anchor="middle" fill="#993C1D">Runs during TTS playback</text>

<!-- Barge-in loop: filters -> back into STT -->
<path d="M490,542 L560,542 L560,194 L490,194" fill="none" stroke="#D85A30" stroke-width="1.25" marker-end="url(#arrow-coral)"/>
<text x="525" y="182" text-anchor="middle" font-size="11" fill="#993C1D">interrupt</text>

<!-- Notes -->
<text x="60" y="610" font-size="13" font-weight="700" fill="#2C2C2A">Notes</text>
<text class="note" x="60" y="628">Voices: ar-JO-TaimNeural (Arabic), en-US-JennyNeural (English).</text>
<text class="note" x="60" y="648">Echo filters: minimum utterance length, cooldown after TTS ends,</text>
<text class="note" x="60" y="666">and a 60% text-overlap check against the agent's last answer.</text>
<text class="note" x="60" y="686">Barge-in: filters run during TTS playback; a genuine interruption</text>
<text class="note" x="60" y="704">stops audio immediately and starts a new turn.</text>

</svg>
