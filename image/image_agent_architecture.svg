<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Image Understanding & OCR Agent Architecture</title>
<desc>Pipeline: user uploads an image and asks a question, the Agentic RAG agent decides which tool to call (analyze_image for visual understanding, extract_text_ocr for text extraction, or both), optionally combined with rag_search and calculator against the existing company-policy knowledge base, producing a final grounded answer.</desc>

<style>
  text { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .note { font-size: 12px; fill: #444441; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="780" fill="#FFFFFF"/>

<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#2C2C2A">Image Understanding &amp; OCR Agent — Architecture</text>

<!-- Node 1: User input -->
<rect x="170" y="50" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text class="th" x="330" y="70" text-anchor="middle">Image + question</text>
<text class="ts" x="330" y="88" text-anchor="middle">User provides image path + a question</text>
<line x1="330" y1="106" x2="330" y2="166" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 2: Agentic RAG agent (decision point) -->
<rect x="170" y="166" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
<text class="th" x="330" y="186" text-anchor="middle" fill="#3C3489">Agentic RAG agent</text>
<text class="ts" x="330" y="204" text-anchor="middle" fill="#534AB7">Decides which tool(s) to call</text>

<!-- Branch down to three tool boxes -->
<line x1="330" y1="222" x2="330" y2="250" stroke="#888780" stroke-width="1.25"/>
<line x1="330" y1="250" x2="170" y2="250" stroke="#888780" stroke-width="1.25"/>
<line x1="330" y1="250" x2="490" y2="250" stroke="#888780" stroke-width="1.25"/>
<line x1="170" y1="250" x2="170" y2="286" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="330" y1="250" x2="330" y2="286" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="490" y1="250" x2="490" y2="286" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 3a: analyze_image -->
<rect x="70" y="286" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
<text class="th" x="170" y="306" text-anchor="middle" fill="#085041" font-size="13">analyze_image</text>
<text class="ts" x="170" y="324" text-anchor="middle" fill="#0F6E56" font-size="11">Visual understanding</text>

<!-- Node 3b: extract_text_ocr -->
<rect x="230" y="286" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.75"/>
<text class="th" x="330" y="306" text-anchor="middle" fill="#0C447C" font-size="13">extract_text_ocr</text>
<text class="ts" x="330" y="324" text-anchor="middle" fill="#185FA5" font-size="11">Arabic / English OCR</text>

<!-- Node 3c: rag_search + calculator -->
<rect x="390" y="286" width="220" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
<text class="th" x="500" y="306" text-anchor="middle" fill="#712B13" font-size="13">rag_search + calculator</text>
<text class="ts" x="500" y="324" text-anchor="middle" fill="#993C1D" font-size="11">Existing company-policy tools</text>

<!-- Converge back down -->
<line x1="170" y1="342" x2="170" y2="370" stroke="#888780" stroke-width="1.25"/>
<line x1="330" y1="342" x2="330" y2="370" stroke="#888780" stroke-width="1.25"/>
<line x1="500" y1="342" x2="500" y2="370" stroke="#888780" stroke-width="1.25"/>
<line x1="170" y1="370" x2="500" y2="370" stroke="#888780" stroke-width="1.25"/>
<line x1="330" y1="370" x2="330" y2="408" stroke="#888780" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Node 4: loop back for multi-tool reasoning -->
<path d="M560,314 C 610,314 610,194 490,194" fill="none" stroke="#7F77DD" stroke-width="1.25" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>
<text x="600" y="250" text-anchor="middle" font-size="11" fill="#534AB7">may chain</text>
<text x="600" y="264" text-anchor="middle" font-size="11" fill="#534AB7">multiple tools</text>

<!-- Node 5: Final answer -->
<rect x="170" y="408" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text class="th" x="330" y="428" text-anchor="middle">Grounded final answer</text>
<text class="ts" x="330" y="446" text-anchor="middle">Same language as the question</text>

<!-- Notes -->
<text x="60" y="520" font-size="13" font-weight="700" fill="#2C2C2A">Notes</text>
<text class="note" x="60" y="540">Both image tools call the same Azure OpenAI vision-capable deployment (gpt-5.4-mini) — no</text>
<text class="note" x="60" y="558">separate Azure AI Vision resource is used.</text>
<text class="note" x="60" y="580">analyze_image and extract_text_ocr are kept as two separate tools (not one "smart" tool) so</text>
<text class="note" x="60" y="598">the model itself decides when OCR is actually needed — satisfying the "no blind OCR" requirement</text>
<text class="note" x="60" y="616">through the same tool-calling mechanism already used for calculator and create_ticket.</text>
<text class="note" x="60" y="638">Each uploaded image gets a stable ID; follow-up questions and explicit "image &lt;id&gt;" references</text>
<text class="note" x="60" y="656">let the agent return to any previously uploaded image within the same session.</text>
<text class="note" x="60" y="678">Case 8 (combining OCR with the existing RAG agent) showed a real limitation: the agent can chain</text>
<text class="note" x="60" y="696">extract_text_ocr → rag_search → calculator correctly, but date-arithmetic estimates and policy</text>
<text class="note" x="60" y="714">interpretation choices (e.g. pro-rata for a partial year) are not always grounded explicitly in</text>
<text class="note" x="60" y="732">the retrieved source text — documented as a known limitation, not a tool-chaining failure.</text>

</svg>
